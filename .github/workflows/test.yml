name: Test
on:
  workflow_dispatch:
  pull_request:
jobs:
  test:
    name: Test
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Set up Go 1.17
      uses: actions/setup-go@v3.2.1
      with:
        go-version: 1.17.6
      id: go
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Report memory
      shell: powershell
      run: |
        wmic cpu get loadpercentage /format:value
        wmic os get freephysicalmemory /format:value
        wmic os get freevirtualmemory /format:value
    - name: Build
      run: make GOFLAGS="-tags=netgo,nodocker" BUILD_IN_CONTAINER=false cmd/agent/agent cmd/agentctl/agentctl cmd/agent-operator/agent-operator
    - name: Report memory
      shell: powershell
      run: |
        wmic cpu get loadpercentage /format:value
        wmic os get freephysicalmemory /format:value
        wmic os get freevirtualmemory /format:value
    - name: Test
      run: make GOFLAGS="-tags=netgo,nodocker" BUILD_IN_CONTAINER=false test
    - name: Report memory
      shell: powershell
      run: |
        wmic cpu get loadpercentage /format:value
        wmic os get freephysicalmemory /format:value
        wmic os get freevirtualmemory /format:value
